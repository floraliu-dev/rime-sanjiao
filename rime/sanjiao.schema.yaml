# Rime schema
# encoding: utf-8
#
# 三角編號輸入法 RIME 方案
#
# 專案首頁：https://github.com/floraliu-dev/rime-sanjiao
# 授權：本方案設定為 MIT；碼表為 Public Domain（見 THIRD_PARTY_NOTICES.md）
#
# 輸入規則（設計理由見 docs/design.md）：
#   - 每個字的編碼固定 6 位數字。
#   - 數字鍵只用來打編碼；選字用點選候選字，或按換行（Enter）／空白鍵送出第一個候選。
#   - 打字時就即時顯示候選字，不必打滿 6 碼。
#   - 編碼結尾的 0 可以省略：打「101」就能找到編碼 101000 的字。
#   - 打滿 6 碼而且只有一個字時，直接送出；有好幾個字時才讓使用者選。
#   - 打滿 6 碼後直接打下一個字的編碼，會自動送出目前第一個候選（連打）。
#   - 打到查不到任何字的編碼時，立刻清空，直接重打。

schema:
  schema_id: sanjiao
  name: 三角編號
  version: "0.2.1"
  author:
    - 編碼規則 胡立人、張源渭、黃克東（美國王安電腦公司）
    - RIME 方案 Flora Liu
  description: |
    三角編號輸入法（Three-Corner Code）。
    每字 6 位數字編碼，碼表收錄 23,820 字（不含 iPhone 顯示不出來的罕用字）。
    碼表來源：chinese-opendesktop/cin-tables（Public Domain）。

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - ascii_composer   # 中／英模式切換
    - key_binder       # 自訂按鍵綁定（翻頁）
    - speller          # 把數字收進編碼
    - punctuator       # 標點符號
    - selector         # 選字、翻頁
    - navigator        # 移動游標
    - express_editor   # 空白鍵送出候選、刪除鍵
  segmentors:
    - ascii_segmentor
    - abc_segmentor    # 把連續的數字切成一段編碼
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator # 查碼表
  filters:
    - uniquifier       # 同一個字出現兩次時只留一個

speller:
  alphabet: "0123456789"
  initials: "0123456789"
  # 編碼最長 6 碼。打第 7 個數字時，若第一個候選已完整對應 6 碼，
  # 就先送出它，再把這個數字當成下一個字的開頭（連打）。
  max_code_length: 6
  # 唯一候選自動送出：打滿 6 碼而且只有一個字時，直接送出，不必再選。
  # 有兩個以上的字時不會送出，等使用者選。
  auto_select: true
  # 打錯碼就清空：打完一個數字後，如果沒有任何字的編碼以目前數字開頭，
  # 立刻清空，不必按刪除鍵。
  auto_clear: auto
  # 省略結尾的 0：為每個以 0 結尾的編碼，額外產生去掉結尾 0 的拼法。
  # 例：101000 → 10100、1010、101。只去掉「非 0 數字之後」的 0，
  # 所以 000000 不會產生空編碼。重複 5 次，涵蓋最多 5 個結尾 0。
  algebra:
    - derive/^([0-9]*[1-9]0*)0$/$1/
    - derive/^([0-9]*[1-9]0*)0$/$1/
    - derive/^([0-9]*[1-9]0*)0$/$1/
    - derive/^([0-9]*[1-9]0*)0$/$1/
    - derive/^([0-9]*[1-9]0*)0$/$1/

translator:
  dictionary: sanjiao
  # 打到一半也顯示以目前數字開頭的字（「~」後面是還沒打的編碼）。
  enable_completion: true
  # 每次只輸入單字，不組句。
  enable_sentence: false
  # 固定字序：候選順序永遠相同，方便記住字的位置，空白鍵與連打也不會
  # 因為曾經選過別的字而送出不同的字。想讓常用字自動往前排，
  # 見 docs/customize.md 的「開啟字頻學習」。
  enable_user_dict: false
  # 不自動造詞。
  enable_encoder: false
  encode_commit_history: false
  # 顯示碼表裡全部的字，包含 Unicode 擴充區的罕用字（排在最後）。
  # iPhone 顯示不出來的罕用字在產生碼表時就已移除，見 docs/design.md。
  enable_charset_filter: false

menu:
  page_size: 10

punctuator:
  # 鍵盤送出 ASCII 符號，這裡轉成全形中文標點。
  # 每個符號只對應一個標點（不跳出選單），按下就直接輸入。
  half_shape: &punct
    ",": "，"
    ".": "。"
    "?": "？"
    "!": "！"
    ":": "："
    ";": "；"
    "\\": "、"
    "[": "「"
    "]": "」"
    "{": "『"
    "}": "』"
    "(": "（"
    ")": "）"
    "<": "《"
    ">": "》"
    "~": "～"
    "^": "……"
    "_": "——"
    # 鍵盤上的「換行」鍵送出 |（見下方 key_binder）。沒在打字時就是換行。
    "|": { commit: "\n" }  # 只寫 "\n" 不會送出，要用 commit
  full_shape: *punct

key_binder:
  bindings:
    # 換行：有候選字時送出第一個，跟空白鍵一樣。例：「月」260000 打 26 再按換行。
    # 倉輸入法的內建換行鍵（enter）在打字途中會自己送出數字，不經過這裡，
    # 所以鍵盤上的換行鍵改送 |；實體鍵盤的 Enter 也照同樣規則。
    - { when: has_menu, accept: bar, send: space }
    - { when: has_menu, accept: Return, send: space }
    # 實體鍵盤：- 和 = 翻頁
    - { when: has_menu, accept: minus, send: Page_Up }
    - { when: has_menu, accept: equal, send: Page_Down }

ascii_composer:
  # 實體鍵盤：按一下 Shift 切換中／英，切換時送出已打的數字
  good_old_caps_lock: true
  switch_key:
    Shift_L: commit_code
    Shift_R: commit_code
    Control_L: noop
    Control_R: noop
    Caps_Lock: clear
    Eisu_toggle: clear
