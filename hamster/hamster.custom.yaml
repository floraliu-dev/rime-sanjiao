# 倉輸入法（Hamster）設定補丁：三角編號鍵盤
#
# 本檔由 build.py 自動產生，請勿手動修改；鍵盤配置定義在 tools/keyboard.py。
# 版本：0.1.0
#
# 注意：
# 1. 匯入後會取代手機上原有的 hamster.custom.yaml（如果有的話）。
# 2. keyboards 清單會整個取代倉內建的自訂鍵盤範例（例如倉頡、大千注音），
#    內建的中文 26 鍵、九宮格、英文鍵盤不受影響。
# 3. useKeyboardType 只在你沒有從倉的設定畫面手動選過鍵盤時生效；
#    如果鍵盤沒有變，請到「鍵盤設定 → 鍵盤佈局」手動選「三角編號」。

patch:
  keyboard:
    useKeyboardType: "三角編號"
  keyboards:
    - name: "三角編號"
      isPrimary: true
      rows:
        - keys:
            - action: { keyboardType: classifySymbolic }
              label: "符號"
            - action: { character: { char: "1" } }
              processByRIME: true
            - action: { character: { char: "2" } }
              processByRIME: true
            - action: { character: { char: "3" } }
              processByRIME: true
            - action: backspace
              swipe:
                - direction: up
                  action: { shortcutCommand: "#重输" }
                  label: "清除"
                  display: true
        - keys:
            - action: { keyboardType: alphabetic }
              label: "ABC"
            - action: { character: { char: "4" } }
              processByRIME: true
            - action: { character: { char: "5" } }
              processByRIME: true
            - action: { character: { char: "6" } }
              processByRIME: true
            - action: { character: { char: "," } }
              label: "，"
              processByRIME: true
              swipe:
                - direction: up
                  action: { character: { char: ";" } }
                  label: "；"
                  display: true
                  processByRIME: true
        - keys:
            - action: nextKeyboard
            - action: { character: { char: "7" } }
              processByRIME: true
            - action: { character: { char: "8" } }
              processByRIME: true
            - action: { character: { char: "9" } }
              processByRIME: true
            - action: { character: { char: "." } }
              label: "。"
              processByRIME: true
              swipe:
                - direction: up
                  action: { character: { char: ":" } }
                  label: "："
                  display: true
                  processByRIME: true
        - keys:
            - action: { character: { char: "?" } }
              label: "？"
              processByRIME: true
              swipe:
                - direction: up
                  action: { character: { char: "!" } }
                  label: "！"
                  display: true
                  processByRIME: true
            - action: { character: { char: "\\" } }
              label: "、"
              processByRIME: true
              swipe:
                - direction: up
                  action: { character: { char: "[" } }
                  label: "「"
                  display: true
                  processByRIME: true
                - direction: down
                  action: { character: { char: "]" } }
                  label: "」"
                  display: true
                  processByRIME: true
            - action: { character: { char: "0" } }
              processByRIME: true
            - action: space
              label: { loadingText: "三角編號", text: "空格" }
            - action: enter
